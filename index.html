<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心情天气</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
:root{--ink:#262a29;--muted:#7d827d;--line:#e5e8df;--paper:#f5f6f0;--card:#fffefa;--green:#738c74}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px 'Noto Sans SC',sans-serif;background-image:radial-gradient(#dce2d8 .65px,transparent .65px);background-size:20px 20px}.wrap{max-width:1020px;margin:auto;padding:30px 22px 60px}.top{display:flex;justify-content:space-between;border-bottom:1px solid #dce1d8;padding:0 0 15px;color:var(--muted);font:11px 'DM Mono',monospace;letter-spacing:.13em}.hero{padding:38px 0 25px}.hero small{font:11px 'DM Mono',monospace;color:var(--green);letter-spacing:.14em}.hero h1{font:clamp(48px,8vw,76px)/1.1 'Ma Shan Zheng',serif;margin:8px 0}.hero p{color:var(--muted);margin:0;line-height:1.8}.grid{display:grid;grid-template-columns:.87fr 1.13fr;gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:23px;box-shadow:0 8px 25px #35422609}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.panel h2{font-size:16px;margin:0}.mono{font:10px 'DM Mono',monospace;color:#989e96;letter-spacing:.1em}.label{color:var(--muted);font-size:12px;margin:18px 0 9px}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{border:1px solid var(--line);background:#fffefa;color:#686e68;border-radius:99px;padding:9px 12px;font:13px 'Noto Sans SC',sans-serif;cursor:pointer;transition:.15s}.choice:hover{border-color:#9ba99b}.choice.active{background:#e7eee3;border-color:#9eaf9e;color:#405942}.moods .choice{font-size:14px;padding:10px 14px}.moods .choice span{margin-right:5px}.range{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px}.range input{flex:1;accent-color:var(--green)}.go{width:100%;border:0;border-radius:5px;padding:12px;background:#405c49;color:white;margin-top:22px;font:14px 'Noto Sans SC',sans-serif;cursor:pointer}.go:hover{background:#314a39}.card{position:relative;overflow:hidden;min-height:390px;border-radius:8px;padding:28px;color:#293331;background:linear-gradient(145deg,#dcebe1,#f3ecdc 60%,#e9e2d2);transition:background .4s}.card:before{content:'';position:absolute;width:240px;height:240px;border-radius:50%;background:#ffffff3b;right:-50px;top:-84px}.card:after{content:'';position:absolute;width:160px;height:160px;border-radius:50%;background:#ffffff27;left:-70px;bottom:-80px}.cardtop,.cardcontent,.cardbottom{position:relative;z-index:1}.cardtop{display:flex;justify-content:space-between;font:10px 'DM Mono',monospace;letter-spacing:.12em;color:#53645c}.weathericon{font-size:50px;line-height:1}.cardcontent{margin:48px 0 37px}.moodname{font:46px 'Ma Shan Zheng',serif;margin:0 0 8px}.quote{font:21px/1.7 'Ma Shan Zheng',serif;max-width:440px;margin:0}.cardbottom{display:flex;justify-content:space-between;align-items:end;border-top:1px solid #42564a2b;padding-top:14px;color:#5e6b64;font-size:11px}.smallmono{font:9px 'DM Mono',monospace;letter-spacing:.12em}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;border:1px solid var(--line);border-radius:5px;background:#fffefa;color:#545c55;padding:10px;font:12px 'Noto Sans SC',sans-serif;cursor:pointer}.actions button:hover{border-color:#93a492}.history{margin-top:18px}.historylist{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:7px}.entry{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:5px}.entry .emoji{font-size:22px}.entry strong{font-size:12px}.entry small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.entry button{border:0;background:none;color:#a3a69f;cursor:pointer}.empty{color:#a2a69e;font-size:12px;line-height:1.7}.foot{text-align:center;color:#a1a79f;font:9px 'DM Mono',monospace;letter-spacing:.12em;margin-top:22px}@media(max-width:740px){.wrap{padding:20px 15px 45px}.grid{grid-template-columns:1fr}.hero{padding:30px 0 20px}.panel{padding:18px}.card{min-height:350px}.cardcontent{margin:42px 0 32px}}
</style></head><body><main class="wrap"><div class="top"><span>✳ INNER FORECAST</span><span>一份给自己的小记录</span></div><header class="hero"><small>CHECK IN WITH YOURSELF</small><h1>心情天气</h1><p>每天留一点空间，看看心里是什么天气。没有标准答案，只要如实感受。</p></header><div class="grid"><section class="panel"><div class="panelhead"><h2>此刻的天气</h2><span class="mono">01 / CHECK-IN</span></div><div class="label">选一个最接近的心情</div><div class="choices moods" id="moods"></div><div class="label">心情强度</div><div class="range"><span>一点点</span><input id="intensity" type="range" min="1" max="5" value="3"><span>很強烈</span></div><div class="label">今天的天空</div><div class="choices" id="skies"></div><div class="label">留一句给今天的话（可选）</div><textarea id="memo" placeholder="今天有什么想记住的？" style="width:100%;height:70px;resize:vertical;border:1px solid var(--line);border-radius:5px;padding:10px;font:13px 'Noto Sans SC',sans-serif;background:#fffefa"></textarea><button class="go" id="make">生成我的心情卡片 ↗</button></section><section><div class="card" id="card"><div class="cardtop"><span>INNER FORECAST · <b id="date"></b></span><span class="weathericon" id="icon">🌤️</span></div><div class="cardcontent"><p class="moodname" id="cardMood">等一等，听听心里的天气</p><p class="quote" id="quote">选好心情和天空，这里会生成一张属于今天的卡片。</p></div><div class="cardbottom"><span id="skyLabel">今天也可以慢慢来</span><span class="smallmono">A MOMENT WITH ME</span></div></div><div class="actions"><button id="save">保存到心情日记</button><button id="download">下载心情卡片</button></div><div class="history"><div class="panelhead" style="margin:21px 0 10px"><h2 style="font-size:14px">最近的天气</h2><span class="mono" id="total">0 DAYS</span></div><div class="historylist" id="history"></div></div></section></div><div class="foot">YOUR FEELINGS ARE WEATHER, NOT THE WHOLE SKY</div></main>
<script>
const moods=[['☀️','晴朗'],['🌤️','轻松'],['🌧️','低落'],['⛈️','焦虑'],['🌫️','迷茫'],['🌈','期待'],['🍃','平静'],['🔥','有劲']];const skies=[['☀️','晴天'],['⛅','多云'],['🌧️','下雨'],['🌫️','起雾'],['🌙','夜晚'],['🌬️','有风']];let mood='',sky='',latest=null,history=JSON.parse(localStorage.getItem('moodWeather')||'[]');const $=x=>document.getElementById(x);const colors={'晴天':['#f6dfaa','#f5edda'],'多云':['#d7e1e2','#ede8dc'],'下雨':['#cbd9e4','#e5e4dc'],'起雾':['#dce2df','#eee9df'],'夜晚':['#263447','#586277'],'有风':['#d7e8da','#f1e6d2']};const notes=['给自己一点时间，云会慢慢移动。','今天不用事事有答案，先照顾好这一刻。','微小的进步也值得被看见。','你可以带着这样的心情，继续往前走。','天气会变，你也不必一直保持同一种状态。','先深呼吸，再决定下一步。','愿你记得，休息也是旅程的一部分。','把今天过完，就已经很了不起。'];
function build(list,el,type){$(el).innerHTML=list.map(([icon,name])=>`<button class="choice" data-type="${type}" data-name="${name}"><span>${icon}</span>${name}</button>`).join('')};build(moods,'moods','mood');build(skies,'skies','sky');document.body.onclick=e=>{let b=e.target.closest('.choice');if(!b)return;document.querySelectorAll(`.choice[data-type="${b.dataset.type}"]`).forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.type==='mood')mood=b.dataset.name;else sky=b.dataset.name};function now(){return new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})}function generate(){if(!mood||!sky){alert('先选一个心情和今天的天空吧。');return}let icon=moods.find(x=>x[1]===mood)[0],si=skies.find(x=>x[1]===sky)[0],intensity=+$('intensity').value;let memo=$('memo').value.trim();latest={mood,sky,intensity,memo,date:now(),icon,skyIcon:si,quote:memo||notes[Math.floor(Math.random()*notes.length)]};$('date').textContent=now();$('icon').textContent=si;$('cardMood').textContent=mood;$('quote').textContent=latest.quote;$('skyLabel').textContent=si+' · 心情强度 '+intensity+'/5';let c=colors[sky]||colors['多云'];$('card').style.background=`linear-gradient(145deg,${c[0]},${c[1]} 65%,#e9e2d2)`;$('card').style.color=sky==='夜晚'?'#f7f3e9':'#293331';}
function drawHistory(){$('total').textContent=history.length+' DAYS';$('history').innerHTML=history.length?history.slice(0,20).map((h,i)=>`<div class="entry"><span class="emoji">${h.icon}</span><div><strong>${h.mood} · ${h.sky}</strong><small>${h.date}${h.memo?' · '+h.memo.replace(/[&<>]/g,''):''}</small></div><button data-remove="${i}">×</button></div>`).join(''):'<div class="empty">保存后的每日心情会留在这里。回头看看，天气一直在变化。</div>';localStorage.setItem('moodWeather',JSON.stringify(history))} $('make').onclick=generate;$('save').onclick=()=>{if(!latest){generate();if(!latest)return}history.unshift({...latest});history=history.slice(0,100);drawHistory();$('save').textContent='已保存 ✓';setTimeout(()=>$('save').textContent='保存到心情日记',1200)};$('history').onclick=e=>{if(e.target.dataset.remove!==undefined){history.splice(+e.target.dataset.remove,1);drawHistory()}};$('download').onclick=()=>{if(!latest){generate();if(!latest)return}let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#dcebe1"/><stop offset="1" stop-color="#f3ecdc"/></linearGradient></defs><rect width="100%" height="100%" rx="28" fill="url(#g)"/><text x="70" y="90" font-family="sans-serif" font-size="22" fill="#53645c">INNER FORECAST · ${latest.date}</text><text x="730" y="160" font-size="80">${latest.skyIcon}</text><text x="70" y="450" font-family="sans-serif" font-size="74" fill="#293331">${latest.icon} ${latest.mood}</text><foreignObject x="70" y="510" width="750" height="300"><div xmlns="http://www.w3.org/1999/xhtml" style="font:42px/1.7 sans-serif;color:#293331">${latest.quote.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div></foreignObject><text x="70" y="1000" font-family="sans-serif" font-size="22" fill="#53645c">${latest.sky} · 心情强度 ${latest.intensity}/5</text></svg>`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download='心情天气.svg';a.click();URL.revokeObjectURL(a.href)};$('date').textContent=now();drawHistory();
</script></body></html>
